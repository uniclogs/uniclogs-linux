---
name: customizations
mmdebstrap:
  packages:
    - build-essential
    - i2c-tools
    - libgpiod-dev
    - libhamlib-utils
    - netcat-openbsd
    - python3-dev
    - python3-hamlib
    - python3-libgpiod
    - python3-pip
  install-recommends: false
  customize-hooks:
    - chroot $1 pip3 install uniclogs-stationd --break-system-packages
    - chroot $1 pip3 install uniclogs-pass-commander --break-system-packages
